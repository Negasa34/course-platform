<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Our Future Vision logo">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#D4AF37"/>
      <stop offset="0.55" stop-color="#10B981"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- circular backdrop glow -->
  <circle cx="60" cy="60" r="52" fill="url(#g)" opacity="0.14"/>

  <!-- stylized open book base (ivory) -->
  <g transform="translate(18,28) scale(0.7)">
    <path d="M44 8c6 0 18 6 28 18 4 5 4 9 3 12-3 8-12 16-28 16-17 0-26-8-30-16-1-3-1-7 3-12C26 14 38 8 44 8z" fill="#FFFFFF" opacity="0.06"/>
    <path d="M44 6c6 0 18 6 28 18 4 5 4 9 3 12-3 8-12 16-28 16-17 0-26-8-30-16-1-3-1-7 3-12C26 12 38 6 44 6z" fill="url(#g)" opacity="0.96"/>
  </g>

  <!-- letter F as circuit + arrow -->
  <g transform="translate(34,20) scale(0.9)">
    <path d="M12 6h18v4H20v6h9v4H20v10H12V6z" fill="#0B0F19"/>
    <path d="M24 2l10 10-10 10" fill="none" stroke="url(#g)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- circuit lines -->
    <circle cx="6" cy="6" r="1.6" fill="#D4AF37" opacity="0.95"/>
    <circle cx="34" cy="6" r="1.6" fill="#10B981" opacity="0.95"/>
    <path d="M7 6h20" stroke="#D4AF37" stroke-opacity="0.6" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- subtle frame -->
  <rect x="8" y="8" width="104" height="104" rx="20" fill="none" stroke="rgba(212,175,55,0.06)"/>
</svg>
